<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>
  </head>
  <body>
    <h1>Reserve Your Table</h1>
    <p>Welcome to Girabaldi Trattoria Pizza & Pasta. We have the best italian food in Garner, North Carolina.</p>
    
    <form>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname">
        <br>
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname">

        <label for="email">Email:</label>
        <input type="email" id="email">

        <label for="phone">Phone: </label>
        <input type="tel" id="phone">

        <label for="date">Reservation Date:</label>
        <input type="date" id="date">

        <label for="time">Reservation Time:</label>
        <input type="time" id="time" name="Reservation-Time">

        <label for="guests">Number of Guests:</label>
        <select id="guests">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5+</option>
        </select>

        <fieldset>
            <legend>Seating Preference</legend>

            <label for="indoor">Indoor</label>
            <input type="radio" name="seating" id="indoor">
            

            <label for="outdoor">Outdoor</label>
            <input type="radio" name="seating" id="outdoor">
            

            <label for="nopreference">No Preference</label>
            <input type="radio" name="seating" id="nopreference">
            
            
        </fieldset>
        

        <label for="requests">Special Requests:</label>
        <textarea id="requests"></textarea>
        
        <button type ="submit">Request Reservation</button>
    </form>

    <script src="./script.js"></script>
  </body>
</html>
